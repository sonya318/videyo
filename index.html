<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose how you want to watch or save the video.">
    <meta name="robots" content="index,follow">

    <!-- Open Graph Tags -->
    <meta property="og:title" content="VideoY Center">
    <meta property="og:description" content="Choose how you want to watch or save the video.">
    <meta property="og:image" content="https://yourdomain.com/thumbnail.jpg"> <!-- REPLACE -->
    <meta property="og:url" content="https://yourdomain.com/video-center?id=VIDEO_ID">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VideoY Center">

    <title>VideoY Center</title>

    <!-- Histats Code -->
    <script type="text/javascript">
        var _Hasync = _Hasync || [];
        _Hasync.push(['Histats.start', '1,4957288,4,0,0,0,00010000']);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function() {
            var hs = document.createElement('script'); 
            hs.type = 'text/javascript'; 
            hs.async = true;
            hs.src = ('//s10.histats.com/js15_as.js');
            (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(hs);
        })();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #f3f4f6;
        }

        .box {
            max-width: 420px;
            width: 100%;
            background: #111111;
            border-radius: 16px;
            padding: 36px 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid #222;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 18px;
            border-radius: 14px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            border: 1px solid #2a2a2a;
        }

        .heading {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .desc {
            text-align: center;
            color: #9ca3af;
            font-size: 14.5px;
            line-height: 1.55;
            margin-bottom: 32px;
        }

        #buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 18px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .text {
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 15px;
            font-weight: 600;
        }

        .sub {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .arrow {
            font-size: 20px;
            opacity: 0.7;
            font-weight: 300;
        }

        /* Color variants */
        .btn-blue {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .btn-green {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .btn-orange {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }
            .box {
                padding: 28px 20px;
            }
            .heading {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="logo">🎬</div>
        <h1 class="heading">VideoY Center</h1>
        <p class="desc">
            Select an option below to continue.
        </p>

        <div id="buttons">
            <a class="btn btn-blue" id="btn1">
                <div class="left">
                    <div class="icon">⬇</div>
                    <div class="text">
                        <div class="title">Save to Device</div>
                        <div class="sub">Download for offline viewing</div>
                    </div>
                </div>
                <div class="arrow">›</div>
            </a>

            <a class="btn btn-green" id="btn2">
                <div class="left">
                    <div class="icon">🎞️</div>
                    <div class="text">
                        <div class="title">More VID</div>
                        <div class="sub">Explore related videos</div>
                    </div>
                </div>
                <div class="arrow">›</div>
            </a>

            <a class="btn btn-orange" id="btn3">
                <div class="left">
                    <div class="icon">▶</div>
                    <div class="text">
                        <div class="title">Watch Now</div>
                        <div class="sub">Play instantly in browser</div>
                    </div>
                </div>
                <div class="arrow">›</div>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoId = new URLSearchParams(window.location.search).get("id");

            let destinations = [
                "https://t.co/wp8ZeRho83",
                "https://t.co/YNuMoDRj0U",
                videoId ? `https://cdn.playnaw.online/?id=${encodeURIComponent(videoId)}` : "https://google.com"
            ];

            // Shuffle links
            destinations = destinations.sort(() => Math.random() - 0.5);

            const buttons = [
                document.getElementById('btn1'),
                document.getElementById('btn2'),
                document.getElementById('btn3')
            ];

            buttons.forEach((btn, index) => {
                if (destinations[index]) {
                    btn.href = destinations[index];
                }
                btn.setAttribute('rel', 'noopener noreferrer');
                // Tidak ada target="_blank" → buka di tab yang sama
            });
        });
    </script>

    <!-- Histats Noscript -->
    <noscript>
        <a href="/" target="_blank">
            <img src="//sstatic1.histats.com/0.gif?4957288&101" alt="" border="0">
        </a>
    </noscript>
</body>
</html>
